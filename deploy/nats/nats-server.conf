# NATS + JetStream relay for a local agora bus.
#
# The relay only ever sees ciphertext (agora encrypts and signs every
# envelope), but it must still not be an open service: every client needs
# the shared token, and the listener is published on loopback (compose) or
# bound to a private address (systemd) only.

server_name: agora-relay

# Inside the container we listen on all interfaces; docker publishes the
# port on 127.0.0.1 (or AGORA_NATS_BIND, e.g. a Tailscale IP) only.
listen: 0.0.0.0:4222
# Monitoring endpoint (http://127.0.0.1:8222/healthz, /jsz).
http: 0.0.0.0:8222

# Shared client token, injected from the environment (never commit it).
authorization {
  token: $AGORA_NATS_TOKEN
}

# agora payloads are small (files are chunked to 32 KiB).
max_payload: 1MB
max_connections: 512

jetstream {
  store_dir: /data
  # Hard caps for the whole server. agora creates its AGORA stream with
  # the per-stream limits from ~/.agora/config.toml (nats_max_bytes,
  # nats_max_age); these caps protect the disk regardless.
  max_memory_store: 64MB
  max_file_store: 2GB
}

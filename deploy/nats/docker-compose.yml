# Local agora relay: NATS with JetStream, token auth, bounded storage.
#
#   cd deploy/nats
#   umask 077; printf 'AGORA_NATS_TOKEN=%s\n' "$(openssl rand -hex 32)" > .env
#   docker compose up -d
#   docker compose ps     # healthy?
#
# Clients (~/.agora/config.toml):
#   relay_url        = "nats://127.0.0.1:4222"
#   relay_token_file = "~/.agora/relay.token"   # same token as in .env
#   nats_max_age     = "30d"
#   nats_max_bytes   = "1073741824"
#
# To serve other hosts on a private network (e.g. Tailscale), set
# AGORA_NATS_BIND=100.x.y.z in .env; never bind it to a public address.
name: agora-relay

services:
  nats:
    # Pinned: bump deliberately after reading the release notes.
    image: nats:2.12.5-alpine
    command: ["-c", "/etc/nats/nats-server.conf"]
    environment:
      AGORA_NATS_TOKEN: ${AGORA_NATS_TOKEN:?set AGORA_NATS_TOKEN in deploy/nats/.env}
    ports:
      - "${AGORA_NATS_BIND:-127.0.0.1}:4222:4222"
      - "127.0.0.1:8222:8222"
    volumes:
      - ./nats-server.conf:/etc/nats/nats-server.conf:ro
      - nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8222/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  nats-data: {}
